base_url = "https://mattmarsico.com"
compile_sass = true
title = "Matt Marsico's Portfolio"
description = "A compilation of all of my interests and snapshot into my life"
generate_feeds = true

taxonomies = [
    {name = "categories", feed = true},
    {name = "tags", feed = true},
]

default_language = "en"
build_search_index = true
generate_sitemap = true
generate_robots_txt = true
minify_html = true

[markdown]
bottom_footnotes = true

# what does this mean?
external_links_target_blank = true
external_links_external = true
external_links_no_referrer = true

lazy_async_image = true
github_alerts = true
insert_anchor_links = "heading"

[markdown.highlighting]
style = "class"
# Theme gallery: https://textmate-grammars-themes.netlify.app/
dark_theme = "everforest-dark"
light_theme = "everforest-dark"
error_on_missing_language = true

[search]
index_format = "elasticlunr_json"
include_title = true
include_description = true
include_content = true

[extra]
author = "Matt Marsico"
github = "https://github.com/mattmars3/mattmarsico.com"
# fediverse.creator = "@username@my.instance.example.com"
# fediverse.rel_me = "https://my.instance.example.com/@username"
# mastodon = "https://my.instance.example.com/@username"
radion_menu = [
    {url = "$BASE_URL/", name = "Home"},
    {url = "$BASE_URL/articles", name = "Articles"},
    {url = "$BASE_URL/aboutme", name = "About Me"},
]
radion_title = "Matt Marsico's Personal Website"

# Nicer codeblocks with copy to clipboard
codeblock = true

# Enable MathJax support
latex = true

# Enable search bar
enable_search = true

# Light/Dark Mode set
theme = "toggle" # options: {light, dark, auto, toggle}

# Whether to display favicon
favicon = true

# Giscus comment support
comments = true
giscus_repo = "mattmars3/mattmarsico.com"
giscus_repo_id = "R_kgDOPoyk5A"
giscus_data_category_id = "DIC_kwDOPoyk5M4Cu8N3"
